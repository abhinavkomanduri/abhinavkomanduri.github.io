{{ define "main" }}
<div style="margin-top:30px"></div>
<div class="container">
<div class="inner-container">
  <div class="row">
    <div class="col-md-8">
      <p><a href="/">&larr; Back</a></p>
      <h2>{{ .Title }}</h2>
      {{ range .Pages }}
      <div class="mb-3">
        <a href="{{ .Permalink }}"><strong>{{ .Title }}</strong></a>
        {{ if .Description }}<br><small>{{ .Description }}</small>{{ end }}
      </div>
      {{ end }}
    </div>
  </div>
</div>
</div>
{{ end }}
