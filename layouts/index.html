<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Site.Title }}</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f9f9f7;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: white;
      border: 1px solid #e8e8e8;
      border-radius: 12px;
      padding: 3rem 3.5rem;
      max-width: 520px;
      width: 100%;
      text-align: center;
    }

    .name {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #1a1a1a;
      margin-bottom: 0.4rem;
    }

    .role {
      font-size: 0.95rem;
      color: #555;
      line-height: 1.5;
      margin-bottom: 2rem;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: #4b2e83;
      margin: 0 auto 2rem;
      border-radius: 2px;
    }

    .message {
      font-size: 1rem;
      color: #444;
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    .message strong {
      color: #1a1a1a;
    }

    .links {
      display: flex;
      justify-content: center;
      gap: 1.25rem;
      flex-wrap: wrap;
      margin-bottom: 2.5rem;
    }

    .links a {
      color: #4b2e83;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .links a:hover { text-decoration: underline; }

    .preview-link {
      font-size: 0.75rem;
      color: #bbb;
      text-decoration: none;
      display: block;
    }

    .preview-link:hover { color: #888; }

    @media (max-width: 480px) {
      .card { padding: 2rem 1.5rem; }
      .name { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="name">{{ .Site.Title }}</div>
    <div class="role">
      {{ .Site.Params.position }}<br>
      {{ .Site.Params.school }}
    </div>
    <div class="divider"></div>
    <p class="message">
      My website is currently under construction.<br>
      Check back in <strong>Fall 2026</strong>.
    </p>
    <div class="links">
      <a href="mailto:{{ .Site.Params.email }}">Email</a>
      <a href="{{ .Site.Params.scholar }}" target="_blank" rel="noopener">Google Scholar</a>
      <a href="{{ .Site.Params.github }}" target="_blank" rel="noopener">GitHub</a>
      <a href="{{ .Site.Params.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
    </div>
    <a class="preview-link" href="/preview/">preview →</a>
  </div>
</body>
</html>
